name: "4 · Публичный тест (1 пост на 1 странице)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Введите PUBLISH, чтобы опубликовать"
        required: true
        default: ""
      page:
        description: "page_id страницы (пусто — та же, что в закрытом тесте)"
        required: false
        default: ""
      test_id:
        description: "ID закрытого теста (пусто — последний)"
        required: false
        default: ""

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  public-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Статья на сайте + пост с фото + первый комментарий со ссылкой
        env:
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
          WP_API_KEY_HETAQRQIR: ${{ secrets.WP_API_KEY_HETAQRQIR }}
          CONFIRM: ${{ inputs.confirm }}
          PAGE: ${{ inputs.page }}
          TEST_ID: ${{ inputs.test_id }}
        run: python -m autopost public-test --confirm "$CONFIRM" --page "$PAGE" --test-id "$TEST_ID"
      - name: Сохранить результат
        if: always()
        run: bash scripts/commit-state.sh "публичный тест — результат"

name: "0 · Проверка кода (без сети)"

on:
  push:
    paths: ["autopost/**", "config/**", "prompts/**", "tests/**", ".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Тесты
        run: python -m unittest discover -s tests -v
      - name: Сухой прогон 2 дней на поддельных Facebook/WordPress
        run: python -m autopost simulate --days 2
